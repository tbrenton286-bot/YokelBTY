<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YokelBook Global</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial}
body{background:#f0f2f5;color:#050505}
header{background:#fff;position:sticky;top:0;z-index:10;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.logo{font-weight:900;font-size:22px;color:#1877f2;letter-spacing:-.5px}
.logo span{color:#000}
.btn{background:#1877f2;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:600}
.card{background:#fff;border-radius:10px;margin:10px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.stories{display:flex;gap:10px;overflow-x:auto;padding:10px 0}
.story{min-width:68px;text-align:center}
.story.circle{width:62px;height:62px;border-radius:50%;background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5);padding:3px;margin:auto}
.story.inner{width:100%;height:100%;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.story p{font-size:12px;margin-top:4px}
textarea{width:100%;border:none;background:#f0f2f5;border-radius:20px;padding:10px 14px;resize:none;outline:none}
.post-actions{display:flex;justify-content:space-between;margin-top:8px;color:#65676b;font-size:14px}
.post-actions button{flex:1;background:none;border:none;padding:8px;font-weight:600;color:#65676b}
.post-actions button.liked{color:#1877f2}
.post-img{width:100%;border-radius:10px;margin-top:8px;max-height:380px;object-fit:cover}
.small{font-size:12px;color:#65676b}
input[type=file]{display:none}
.upload-label{background:#e4e6eb;padding:6px 10px;border-radius:15px;font-size:13px}
</style>
</head>
<body>
<header>
<div class="logo">YokelBook <span>Global</span></div>
<button class="btn" onclick="document.getElementById('postText').focus()">+ Post</button>
</header>
<div class="card">
<div class="stories" id="stories">
<div class="story"><div class="circle"><div class="inner">Y</div></div><p>Your Story</p></div>
<div class="story"><div class="circle"><div class="inner">PNG</div></div><p>PNG</p></div>
<div class="story"><div class="circle"><div class="inner">🌍</div></div><p>Global</p></div>
</div>
</div>
<div class="card">
<textarea id="postText" rows="2" placeholder="What's on your mind? YokelBook Global!"></textarea>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
<label class="upload-label" for="imgInput">📷 Photo</label>
<input type="file" id="imgInput" accept="image/*">
<button class="btn" onclick="createPost()">Post</button>
</div>
<img id="preview" style="display:none;width:100%;border-radius:10px;margin-top:10px;max-height:300px;object-fit:cover">
</div>
<div id="feed"></div>
<script>
let posts = JSON.parse(localStorage.getItem('yokel_posts') || '[]');
let tempImg = '';
document.getElementById('imgInput').addEventListener('change', e=>{
 const r=new FileReader();
 r.onload=()=>{tempImg=r.result;document.getElementById('preview').src=tempImg;document.getElementById('preview').style.display='block';}
 r.readAsDataURL(e.target.files[0]);
});
function createPost(){
 const text=document.getElementById('postText').value.trim();
 if(!text &&!tempImg) return alert('Type something!');
 posts.unshift({id:Date.now(),text,img:tempImg,likes:0,liked:false,comments:[],time:new Date().toLocaleString()});
 save(); document.getElementById('postText').value=''; tempImg=''; document.getElementById('preview').style.display='none';
}
function save(){localStorage.setItem('yokel_posts',JSON.stringify(posts));render();}
function toggleLike(id){
 const p=posts.find(x=>x.id==id); p.liked=!p.liked; p.likes+=p.liked?1:-1; save();
}
function addComment(id){
 const input=document.getElementById('c-'+id); const txt=input.value.trim(); if(!txt) return;
 const p=posts.find(x=>x.id==id); p.comments.push(txt); save(); input.value='';
}
function render(){
 const f=document.getElementById('feed'); f.innerHTML='';
 if(posts.length==0) f.innerHTML='<div class=card style=text-align:center;color:#65676b>No posts yet. Be first!</div>';
 posts.forEach(p=>{
  const d=document.createElement('div'); d.className='card';
  d.innerHTML=`<div style="font-weight:700">Taani Brenton <span class=small>· ${p.time}</span></div>
  <div style="margin:8px 0;white-space:pre-wrap">${p.text}</div>
  ${p.img?`<img class=post-img src="${p.img}">`:''}
  <div class=small style="margin-top:8px">${p.likes} likes · ${p.comments.length} comments</div>
  <div class=post-actions>
  <button class="${p.liked?'liked':''}" onclick="toggleLike(${p.id})">👍 Like</button>
  <button onclick="document.getElementById('c-${p.id}').focus()">💬 Comment</button>
  <button onclick="navigator.share?navigator.share({title:'YokelBook',text:'${p.text.replace(/'/g,"")}'}):alert('Shared!')">↗ Share</button>
  </div>
  <div>${p.comments.map(c=>`<div style="background:#f0f2f5;border-radius:15px;padding:6px 10px;margin:5px 0;font-size:14px">${c}</div>`).join('')}</div>
  <div style="display:flex;gap:6px;margin-top:6px"><input id="c-${p.id}" placeholder="Write a comment..." style="flex:1;background:#f0f2f5;border:none;border-radius:20px;padding:8px 12px"><button class=btn onclick="addComment(${p.id})">Post</button></div>`;
  f.appendChild(d);
 });
}
render();
if(posts.length==0){
 posts=[{id:1,text:"Welcome to YokelBook Global! 🌍🚀 Your own Facebook that works 100% OFFLINE! Posts save on your phone, likes & comments work! From Port Moresby to the World!",img:"",likes:12,liked:false,comments:["First! 🔥","Well done Taani!"],time:"Now"}];
 save();
}
</script>
</body>
</html>
