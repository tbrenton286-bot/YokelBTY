<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YokelBook Global</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f0f2f5;color:#050505}
header{background:#fff;position:sticky;top:0;z-index:100;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.logo{font-weight:900;font-size:22px;color:#1877f2} .logo span{color:#000}
.search{background:#f0f2f5;border:none;padding:8px 15px;border-radius:20px;width:40vw}
.main{max-width:600px;margin:10px auto;padding:0 10px}
.card{background:#fff;border-radius:10px;margin-bottom:15px;padding:15px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.btn{background:#1877f2;color:#fff;border:none;padding:8px 15px;border-radius:6px;font-weight:bold;width:100%;margin-top:10px}
input,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:6px}
.stories{display:flex;gap:10px;overflow-x:auto;padding:10px 0}
.story{min-width:68px;text-align:center}
.story img{width:60px;height:60px;border-radius:50%;border:3px solid #1877f2}
</style>
</head>
<body>
<header>
<div class="logo">Yokel<span>Book</span> Global</div>
<input class="search" placeholder="Search YokelBook">
</header>
<div class="main">
<div class="card">
<div class="stories">
<div class="story"><img src="https://i.pravatar.cc/100?img=1"><div>You</div></div>
<div class="story"><img src="https://i.pravatar.cc/100?img=2"><div>John</div></div>
<div class="story"><img src="https://i.pravatar.cc/100?img=3"><div>Sarah</div></div>
<div class="story"><img src="https://i.pravatar.cc/100?img=4"><div>Peter</div></div>
</div>
</div>
<div class="card">
<h3>Create Post</h3>
<textarea id="postText" placeholder="What's on your mind, Taani?"></textarea>
<input id="postImg" placeholder="Image URL (optional)">
<button class="btn" onclick="createPost()">Post to YokelBook</button>
</div>
<div id="feed">
<div class="card">
<b>Welcome to YokelBook Global 🌍</b><br><br>
Your PNG Facebook is LIVE! Post anything - it will appear here!
<br><br>
<button class="btn" style="background:#42b72a">Share • Like • Comment Working!</button>
</div>
</div>
</div>
<script>
function createPost(){
let t=document.getElementById('postText').value;
let img=document.getElementById('postImg').value;
if(!t)return alert('Write something!');
let feed=document.getElementById('feed');
let div=document.createElement('div');
div.className='card';
div.innerHTML=`<b>tbrenton286-bot</b> • Just now<br><br>${t}<br>${img?`<br><img src="${img}" style="width:100%;border-radius:10px;margin-top:10px">`:''}<br><br><button class="btn" style="background:#f0f2f5;color:#000">👍 Like • 💬 Comment • ↗️ Share</button>`;
feed.prepend(div);
document.getElementById('postText').value='';
document.getElementById('postImg').value='';
}
</script>
</body>
</html>
