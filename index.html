<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YokelBTY V33.3 FB</title>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,onSnapshot,query,orderBy,serverTimestamp,doc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const cfg={apiKey:"AIzaSyA7JJpeSfV-pY-XCtsdXLvITFQmAvZ8pKo",authDomain:"yokelbook-global.firebaseapp.com",projectId:"yokelbook-global",storageBucket:"yokelbook-global.firebasestorage.app",messagingSenderId:"1048288092483",appId:"1:1048288092483:web:0f6eb6073dfc94b0d3cff6"};
const app=initializeApp(cfg);const db=getFirestore(app);const storage=getStorage(app);
window.fb={db,storage,collection,addDoc,onSnapshot,query,orderBy,serverTimestamp,doc,deleteDoc,ref,uploadBytes,getDownloadURL};
</script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff}.top{position:fixed;top:0;width:100%;background:linear-gradient(90deg,#000,#ff3c00);padding:12px;display:flex;justify-content:space-between;z-index:99}.main{margin-top:60px;margin-bottom:80px}.card{background:#111;margin:8px;border-radius:16px;border:1px solid #222;padding:12px}.btn{border:none;padding:13px;border-radius:12px;font-weight:900;width:100%;margin-top:8px}.btn-world{background:linear-gradient(90deg,#ff3c00,#ff0000);color:#fff}input,textarea{width:100%;padding:12px;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:10px;margin-top:8px}.nav{position:fixed;bottom:0;width:100%;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}.nav div{color:#666;font-size:10px;text-align:center;flex:1}.nav div.active{color:#ffcc00}img,video{width:100%;border-radius:12px;margin-top:8px;max-height:500px;object-fit:contain;background:#000}</style></head><body>
<div class="top"><b>YOKEL BTY 🇵🇬 V33.3 FB</b><span style="background:#00ff88;color:#000;padding:4px 8px;border-radius:8px;font-size:10px">yokel • LIVE</span></div>
<div class="main" id="tab-feed">
<div class="card" style="border:1px solid #00ff88">
<div style="font-size:12px;color:#0f0">☁️ WORLD CLOUD • <span id="count">0</span> posts • <b style="color:#ffcc00">yokel</b></div>
<textarea id="postText" placeholder="Type text like FB..."></textarea>
<div style="font-size:11px;color:#888;margin-top:6px">📷 Add photo/video like FB (optional):</div>
<input type="file" id="fileFeed" accept="image/*,video/*" onchange="previewFile()">
<div id="preview" style="display:none;margin-top:8px;border:1px dashed #444;border-radius:12px;padding:8px"><img id="previewImg" style="display:none"><video id="previewVid" controls style="display:none"></video><button onclick="clearFile()" style="background:#222;color:#fff;border:1px solid #333;padding:6px;border-radius:8px;margin-top:6px;font-size:11px">❌ Remove</button></div>
<button class="btn btn-world" onclick="postReal()">Postim to WORLD 🚀 Text+Photo FB</button>
<div id="log" style="font-size:11px;background:#000;padding:8px;border-radius:8px;margin-top:8px;border:1px solid #222">Ready...</div>
</div>
<div id="feedList"><div class="card" style="text-align:center;color:#666">Loading WORLD...</div></div>
</div>
<div class="nav"><div class="active">🏠<br>Feed</div><div>🎬<br>Reels</div><div>🛒<br>Sells</div><div>📦<br>Box</div><div>💰<br>Earn</div></div>
<script type="module">
let currentUser='yokel';
window.previewFile=function(){const f=document.getElementById('fileFeed').files[0];if(!f)return;document.getElementById('preview').style.display='block';if(f.type.startsWith('video')){document.getElementById('previewImg').style.display='none';const v=document.getElementById('previewVid');v.style.display='block';v.src=URL.createObjectURL(f);}else{document.getElementById('previewVid').style.display='none';const i=document.getElementById('previewImg');i.style.display='block';i.src=URL.createObjectURL(f);}}
window.clearFile=function(){document.getElementById('fileFeed').value='';document.getElementById('preview').style.display='none';}
window.postReal=async function(){
 const text=document.getElementById('postText').value.trim();
 const file=document.getElementById('fileFeed').files[0];
 const log=document.getElementById('log');
 if(!text&&!file){alert('Type text OR photo');return;}
 const fb=window.fb;let url='';
 try{
  if(file){log.innerText='📤 Uploading...';const r=fb.ref(fb.storage,'YokelBTY/live/'+Date.now()+'_'+file.name);await fb.uploadBytes(r,file);url=await fb.getDownloadURL(r);}
  await fb.addDoc(fb.collection(fb.db,'live'),{text:text||'',url,type:file?(file.type.startsWith('video')?'video':'image'):'text',user:currentUser,time:new Date().toLocaleString(),createdAt:fb.serverTimestamp()});
  log.innerText='✅ Posted FB style!';document.getElementById('postText').value='';clearFile();
 }catch(e){log.innerText='❌ '+e.message;alert('FAILED: '+e.message);}
};
setTimeout(()=>{
 const fb=window.fb;
 const q=fb.query(fb.collection(fb.db,'live'),fb.orderBy('createdAt','desc'));
 fb.onSnapshot(q,(snap)=>{
  let html='';let c=0;
  snap.forEach(d=>{const p=d.data();c++;
   let m='';if(p.url){m=p.type==='video'?`<video src="${p.url}" controls playsinline></video>`:`<img src="${p.url}">`;}
   html+=`<div class="card"><b>${p.user}</b> <small style="color:#888">${p.time||''}</small><div style="margin-top:8px">${p.text||''}</div>${m}</div>`;
  });
  document.getElementById('feedList').innerHTML=html||'No posts - be first!';
  document.getElementById('count').innerText=c;
 });
},800);
</script>
</body></html>
