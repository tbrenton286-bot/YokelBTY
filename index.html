<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YokelBTY V31.2 - WORLD CLOUD LIVE</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyA7JJpeSfV-pY-XCtsdXLvITFQmAvZ8pKo",
  authDomain: "yokelbook-global.firebaseapp.com",
  databaseURL: "https://yokelbook-global-default-rtdb.firebaseio.com",
  projectId: "yokelbook-global",
  storageBucket: "yokelbook-global.firebasestorage.app",
  messagingSenderId: "1048288092483",
  appId: "1:1048288092483:web:0f6eb6073dfc94b0d3cff6",
  measurementId: "G-PWSQK0RMRK"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
window.fb = { db, storage, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, ref, uploadBytes, getDownloadURL };
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#000;color:#fff}
.top{position:fixed;top:0;width:100%;z-index:100;background:#000;border-bottom:1px solid #222;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px;background:linear-gradient(90deg,#ff0050,#00f2ea);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.main{margin-top:50px;margin-bottom:65px}
.nav{position:fixed;bottom:0;width:100%;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:6px 0;z-index:100}
.nav div{font-size:9px;text-align:center;color:#666;flex:1;cursor:pointer}
.nav div.active{color:#fff}
.nav span{font-size:18px;display:block}
.card{background:#111;margin:8px;border-radius:14px;border:1px solid #222;padding:12px}
.btn{border:none;padding:11px;border-radius:10px;font-weight:900;width:100%;margin-top:8px;cursor:pointer}
.btn-world{background:#fff;color:#000}
.btn-pin{background:#ffcc00;color:#000}
.btn-green{background:#00ff88;color:#000}
.hidden{display:none}
select,input,textarea{background:#000;border:1px solid #333;color:#fff;padding:10px;border-radius:8px;width:100%;margin-top:6px}
.reel-card{position:relative;background:#000;width:100%;height:calc(100vh - 112px);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.reel-card video{width:100%;height:100%;object-fit:contain;background:#000}
.reel-info{position:absolute;bottom:14px;left:12px;right:68px;text-shadow:0 2px 6px #000}
.live-dot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<div class="top"><div class="logo">YokelBTY</div><div style="font-size:10px"><span class="live-dot"></span> WORLD CLOUD LIVE V31.2</div></div>
<div class="main" id="tab-feed">
<div class="card" style="border-color:#00ff88">
<b>YokelBTY WORLD CLOUD</b><div style="font-size:10px;color:#0f0">yokelbook-global LIVE | No phone storage</div>
<textarea id="postText" placeholder="Wanem niupela? YokelBTY!"></textarea>
<input type="file" id="fileFeed" accept="image/*,video/*">
<button class="btn btn-world" onclick="postReal()">Post to YokelBTY World</button>
<div style="font-size:10px;color:#0f0;margin-top:6px">Cloud posts: <span id="cloudCount">0</span></div>
</div>
<div id="feedList"><div class="card" style="text-align:center;color:#666">Loading YokelBTY WORLD...</div></div>
</div>
<div class="main hidden" id="tab-reels"><div style="padding:8px"><button class="btn btn-world" style="width:auto" onclick="document.getElementById('fileReel').click()">Post Reel</button><input type="file" id="fileReel" accept="video/*" hidden onchange="postReelReal(this)"></div><div id="reelsList"></div></div>
<div class="main hidden" id="tab-sells"><div id="sellsList"></div></div>
<div class="main hidden" id="tab-earn">
<div class="card" style="border-color:#00ff88"><h3>YokelBTY Earn - YOU earn</h3><h1>K <span id="myEarn">0.00</span></h1><div id="earnDetails" style="font-size:11px;background:#000;padding:8px;border-radius:8px;margin-top:8px"></div><div id="myBankInfo" style="margin-top:8px;font-size:11px"></div><button class="btn btn-green" onclick="withdraw()">Withdraw to My PNG Bank</button><button class="btn btn-pin" onclick="payFee()">Pay 10% Fee to BSP 3127021932525</button></div>
<div class="card" style="border-color:#ffcc00"><h4>YokelBTY Admin Fees</h4><h2 style="color:#ffcc00">K <span id="adminEarn">0.00</span></h2></div>
</div>
<div class="main hidden" id="tab-bank"><div class="card"><h3>MY PNG BANK</h3><select id="bankSelect"><option>BSP - Bank South Pacific</option><option>Kina Bank</option><option>ANZ PNG</option><option>Westpac PNG</option><option>MiBank</option><option>TISA Bank</option><option>MiCash Mobile</option></select><input id="accName" placeholder="Account name"><input id="accNum" placeholder="Account number"><input id="accBranch" placeholder="Branch"><button class="btn btn-pin" onclick="saveBank()">Save Bank</button><div id="savedBank" style="margin-top:10px"></div></div></div>
<div class="main hidden" id="tab-tokbox"><div class="card">TokBox V32</div></div>
<div class="main hidden" id="tab-inbox"><div class="card">Inbox</div></div>
<div class="nav">
<div class="active" id="n-feed" onclick="showTab('feed')"><span>🏠</span>Feed</div>
<div id="n-reels" onclick="showTab('reels')"><span>🎬</span>Reels</div>
<div id="n-sells" onclick="showTab('sells')"><span>🛒</span>Sells</div>
<div id="n-tokbox" onclick="showTab('tokbox')"><span>📦</span>TokBox</div>
<div id="n-inbox" onclick="showTab('inbox')"><span>📥</span>Inbox</div>
<div id="n-earn" onclick="showTab('earn')"><span>💰</span>Earn</div>
<div id="n-bank" onclick="showTab('bank')"><span>🏦</span>Bank</div>
</div>
<script type="module">
let bankData = JSON.parse(localStorage.getItem('yokel_bank_only')||'{"name":"BSP - Bank South Pacific","accName":"Brenton Ta\'ani","accNum":"3127021932525","branch":"Waigani"}');
let earn = JSON.parse(localStorage.getItem('yokel_earn_v31')||'{"feed":0,"reel":0,"like":0,"feeOwed":0,"feePaid":0,"admin":0}');
function saveEarn(){localStorage.setItem('yokel_earn_v31', JSON.stringify(earn));}
window.showTab = function(t){document.querySelectorAll('.main').forEach(e=>e.classList.add('hidden'));document.querySelectorAll('.nav div').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t).classList.remove('hidden');document.getElementById('n-'+t).classList.add('active');};
window.postReal = async function(){
  const text=document.getElementById('postText').value||'YokelBTY post';
  const file=document.getElementById('fileFeed').files[0];
  const fb=window.fb; let url='';
  if(file){ if(file.size>50*1024*1024){alert('Max 50MB');return}
    try{ const r=fb.ref(fb.storage,'YokelBTY/posts/'+Date.now()+'_'+file.name); await fb.uploadBytes(r,file); url=await fb.getDownloadURL(r);}catch(e){alert('Storage rules allow read,write true | '+e.message);return;}
  }
  const data={text,url,type:file?(file.type.startsWith('video')?'video':'image'):'text',bank:bankData.name,accName:bankData.accName,accNum:bankData.accNum,time:new Date().toLocaleString(),createdAt:fb.serverTimestamp(),app:'YokelBTY'};
  try{ await fb.addDoc(fb.collection(fb.db,'YokelBTY_WorldPosts'), data); earn.feed+=2;earn.feeOwed+=0.20;earn.admin+=0.20;saveEarn();renderEarn(); document.getElementById('postText').value=''; document.getElementById('fileFeed').value=''; }catch(e){alert(e.message);}
};
window.postReelReal = async function(input){
  const file=input.files[0]; if(!file)return; if(file.size>50*1024*1024){alert('Max 50MB');return}
  const fb=window.fb; let url='';
  try{ const r=fb.ref(fb.storage,'YokelBTY/reels/'+Date.now()+'_'+file.name); await fb.uploadBytes(r,file); url=await fb.getDownloadURL(r);}catch(e){alert(e.message);return;}
  const data={text:'YokelBTY Reel - my dream is not only for me but for my family too.',url,type:'reel',bank:bankData.name,time:new Date().toLocaleString(),createdAt:fb.serverTimestamp(),app:'YokelBTY'};
  try{ await fb.addDoc(fb.collection(fb.db,'YokelBTY_WorldPosts'), data); earn.reel+=5;earn.feeOwed+=0.5;earn.admin+=0.5;saveEarn();renderEarn(); alert('Reel posted!'); }catch(e){alert(e.message);}
};
window.renderEarn=function(){let total=earn.feed+earn.reel+earn.like;document.getElementById('myEarn').innerText=total.toFixed(2);document.getElementById('earnDetails').innerHTML=`Feed: K${earn.feed.toFixed(2)}<br>Reels: K${earn.reel.toFixed(2)}<br>Fee to BSP 3127021932525: K${earn.feeOwed.toFixed(2)}`;document.getElementById('adminEarn').innerText=earn.admin.toFixed(2);document.getElementById('myBankInfo').innerHTML=`Your earnings -> <b>${bankData.name}</b> ${bankData.accNum}`;}
window.withdraw=function(){let t=earn.feed+earn.reel+earn.like; if(t<=0){alert('Post first');return} alert('Withdraw K'+t.toFixed(2)+' to YOUR BANK: '+bankData.name+' - '+bankData.accNum); earn.feed=0;earn.reel=0;earn.like=0;saveEarn();renderEarn();}
window.payFee=function(){if(earn.feeOwed<=0){alert('No fee');return} alert('Paid K'+earn.feeOwed.toFixed(2)+' to BSP 3127021932525'); earn.feePaid+=earn.feeOwed;earn.feeOwed=0;saveEarn();renderEarn();}
window.saveBank=function(){let name=document.getElementById('bankSelect').value;let accName=document.getElementById('accName').value||bankData.accName;let accNum=document.getElementById('accNum').value||bankData.accNum;let branch=document.getElementById('accBranch').value||bankData.branch;bankData={name,accName,accNum,branch};localStorage.setItem('yokel_bank_only',JSON.stringify(bankData));alert('Bank saved: '+name);renderBank();renderEarn();}
window.renderBank=function(){document.getElementById('bankSelect').value=bankData.name;document.getElementById('accName').value=bankData.accName;document.getElementById('accNum').value=bankData.accNum;document.getElementById('accBranch').value=bankData.branch;document.getElementById('savedBank').innerHTML=`<div style="background:#000;border:1px solid #00ff88;padding:8px;border-radius:8px">🏦 ${bankData.name}<br>👤 ${bankData.accName}<br>🔢 ${bankData.accNum}</div>`;}
renderBank();renderEarn();
setTimeout(()=>{
  const fb=window.fb;
  const q=fb.query(fb.collection(fb.db,'YokelBTY_WorldPosts'), fb.orderBy('createdAt','desc'));
  fb.onSnapshot(q,(snap)=>{
    let feedHtml='';let reelHtml='';let sellHtml='';let count=0;
    snap.forEach(doc=>{const p=doc.data();count++;
      let media=''; if(p.url){ if(p.type==='video'||p.url.includes('.mp4')) media=`<video src="${p.url}" controls playsinline style="width:100%;max-height:500px;background:#000"></video>`; else media=`<img src="${p.url}" style="width:100%;max-height:600px;object-fit:contain;background:#000">`; }
      if(p.type==='reel'){ reelHtml+=`<div class="reel-card"><video src="${p.url}" controls playsinline loop></video><div class="reel-info"><div style="background:#fff;color:#000;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:900">YokelBTY • ${p.bank||'PNG'}</div><div style="margin-top:6px;font-size:12px">my dream is not only for me but for my family too.</div><small>${p.time}</small></div></div>`; }
      else { let html=`<div class="card"><div style="display:flex;gap:8px;align-items:center"><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(45deg,#ff0050,#00f2ea);display:flex;align-items:center;justify-content:center;font-weight:900">YB</div><b>YokelBTY</b><small style="color:#888;margin-left:6px">${p.time||''}</small><span style="margin-left:auto;font-size:9px;background:#222;padding:2px 6px;border-radius:6px">${p.bank||'BSP'}</span></div><div style="margin:8px 0">${p.text||''}</div>${media}<div style="font-size:11px;color:#888;margin-top:8px">🏦 ${p.bank||'BSP'} • YokelBTY WORLD</div></div>`; feedHtml+=html; if(p.text&&p.text.toLowerCase().includes('sell')) sellHtml+=html; }
    });
    document.getElementById('feedList').innerHTML=feedHtml||'<div class="card" style="text-align:center;color:#666">No YokelBTY posts yet</div>';
    document.getElementById('reelsList').innerHTML=reelHtml||'<div class="card" style="text-align:center">No reels</div>';
    document.getElementById('sellsList').innerHTML=sellHtml||'<div class="card">No sells</div>';
    document.getElementById('cloudCount').innerText=count;
  },(err)=>{document.getElementById('feedList').innerHTML='<div class="card" style="color:#ff0050">Firestore error: '+err.message+'<br>Create Firestore test mode</div>';});
},800);
</script>
</body>
</html>
