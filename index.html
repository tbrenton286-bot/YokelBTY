<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YokelBTY V33 FINAL - WORLD CLOUD</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyA7JJpeSfV-pY-XCtsdXLvITFQmAvZ8pKo",
  authDomain: "yokelbook-global.firebaseapp.com",
  databaseURL: "https://yokelbook-global-default-rtdb.firebaseio.com",
  projectId: "yokelbook-global",
  storageBucket: "yokelbook-global.firebasestorage.app",
  messagingSenderId: "1048288092483",
  appId: "1:1048288092483:web:0f6eb6073dfc94b0d3cff6"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
window.fb = { db, storage, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, increment, deleteDoc, ref, uploadBytes, getDownloadURL };
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#000;color:#fff}
.top{position:fixed;top:0;width:100%;z-index:100;background:linear-gradient(90deg,#000,#ff3c00);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:17px}
.main{margin-top:54px;margin-bottom:70px}
.nav{position:fixed;bottom:0;width:100%;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:6px 0;z-index:100}
.nav div{font-size:9px;text-align:center;color:#666;flex:1;cursor:pointer}
.nav div.active{color:#ffcc00}
.nav span{font-size:18px;display:block}
.card{background:#111;margin:8px;border-radius:16px;border:1px solid #222;padding:12px}
.btn{border:none;padding:13px;border-radius:12px;font-weight:900;width:100%;margin-top:8px;cursor:pointer}
.btn-world{background:linear-gradient(90deg,#000,#ff1a1a);color:#fff}
.btn-pin{background:#ffcc00;color:#000}
.btn-green{background:#00ff88;color:#000}
.btn-dark{background:#222;color:#fff;border:1px solid #333}
.hidden{display:none}
select,input,textarea{background:#0a0a0a;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;width:100%;margin-top:8px}
#loginScreen{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:380px;background:#111;border:1px solid #222;border-radius:20px;padding:22px}
.login-logo{text-align:center;font-size:32px;font-weight:900;background:linear-gradient(90deg,#ff0050,#00f2ea);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.input-wrap{position:relative}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px}
.link{font-size:12px;color:#ffcc00;cursor:pointer;text-align:center;margin-top:12px;display:block}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(45deg,#ff0050,#00f2ea);display:flex;align-items:center;justify-content:center;font-weight:900}
.action-row{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid #222}
.action-row button{flex:1;background:#0a0a0a;border:1px solid #222;color:#aaa;padding:8px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div id="loginScreen">
<div class="login-box">
<div class="login-logo">YokelBTY</div>
<div style="text-align:center;font-size:11px;color:#00ff88;margin-bottom:18px">V33 FINAL • WORLD CLOUD</div>
<div id="loginForm">
<input id="loginUser" placeholder="Username (yokel)">
<div class="input-wrap"><input id="loginPass" type="password" placeholder="Password (123)"><span class="eye" onclick="toggleEye('loginPass',this)">👁️</span></div>
<button class="btn btn-world" onclick="doLogin()">Login to YokelBTY 🔥</button>
<span class="link" onclick="showForgot()">Forgot password?</span>
<span class="link" onclick="showCreate()">Create account</span>
</div>
<div id="createForm" class="hidden">
<input id="createUser" placeholder="Choose username">
<div class="input-wrap"><input id="createPass" type="password" placeholder="Password"><span class="eye" onclick="toggleEye('createPass',this)">👁️</span></div>
<div class="input-wrap"><input id="createPass2" type="password" placeholder="Confirm"><span class="eye" onclick="toggleEye('createPass2',this)">👁️</span></div>
<input id="createBank" placeholder="BSP 3127021932525">
<button class="btn btn-pin" onclick="doCreate()">Create Account ✅</button>
<span class="link" onclick="showLogin()">Back to Login</span>
</div>
<div id="forgotForm" class="hidden">
<input id="forgotUser" placeholder="Username">
<button class="btn btn-pin" onclick="doForgot()">Recover 🔑</button>
<span class="link" onclick="showLogin()">Back</span>
<div id="forgotResult" style="margin-top:12px;color:#00ff88;background:#000;padding:10px;border-radius:10px;border:1px solid #222"></div>
</div>
</div>
</div>

<div class="top"><div class="logo">YOKEL BTY 🇵🇬 <span style="background:#ffcc00;color:#000;padding:2px 8px;border-radius:10px;font-size:11px">V33 FINAL</span></div><div><button onclick="logout()" style="background:#222;color:#fff;border:1px solid #333;padding:6px 10px;border-radius:8px">Out</button></div></div>

<div class="main" id="tab-feed">
<div class="card" style="border-color:#00ff88">
<div style="display:flex;gap:10px;align-items:center"><div class="avatar">Y</div><div><b id="currentUserDisplay">Yokel</b><div style="font-size:10px;color:#00ff88">WORLD CLOUD • <span id="liveStatus">Connecting...</span></div></div></div>
<textarea id="postText" placeholder="Wanem niupela?"></textarea>
<input type="file" id="fileFeed" accept="image/*,video/*">
<div style="display:flex;gap:8px"><button class="btn btn-world" style="flex:1" onclick="postReal()">Postim to WORLD ☁️🚀</button><button class="btn btn-dark" style="flex:0 0 70px" onclick="document.getElementById('postText').value=''">Clear</button></div>
<div style="font-size:11px;color:#0f0;margin-top:8px">☁️ <span id="cloudCount">0</span> posts in live</div>
</div>
<div id="feedList"><div class="card" style="text-align:center">Loading...</div></div>
</div>

<div class="main hidden" id="tab-reels"><div style="padding:8px"><button class="btn btn-world" style="width:auto" onclick="document.getElementById('fileReel').click()">Post Reel ☁️</button><input type="file" id="fileReel" accept="video/*" hidden onchange="postReelReal(this)"></div><div id="reelsList"></div></div>
<div class="main hidden" id="tab-sells"><div class="card">🏪 Sells</div><div id="sellsList"></div></div>
<div class="main hidden" id="tab-tokbox"><div class="card"><h3>📦 TokBox</h3><div style="display:flex;gap:8px;margin-top:10px"><input id="tokMsg" placeholder="Message..."><button class="btn btn-pin" style="width:auto;margin:0" onclick="sendTokBox()">Send</button></div></div><div id="tokboxList"></div></div>
<div class="main hidden" id="tab-inbox"><div class="card">📥 Inbox</div><div id="inboxList"></div></div>
<div class="main hidden" id="tab-earn"><div class="card"><h3>💰 Earn K <span id="myEarn">0.00</span></h3><div id="earnDetails"></div><button class="btn btn-green" onclick="withdraw()">Withdraw to BSP 3127021932525</button><button class="btn btn-pin" onclick="payFee()">Pay 10% Fee</button></div></div>
<div class="main hidden" id="tab-bank"><div class="card"><h3>🏦 Bank</h3><select id="bankSelect"><option>BSP - Bank South Pacific</option><option>Kina Bank</option></select><input id="accName" placeholder="Name"><input id="accNum" placeholder="Number"><button class="btn btn-pin" onclick="saveBank()">Save</button><div id="savedBank"></div></div></div>

<div class="nav">
<div class="active" id="n-feed" onclick="showTab('feed')"><span>🏠</span>Feed</div>
<div id="n-reels" onclick="showTab('reels')"><span>🎬</span>Reels</div>
<div id="n-sells" onclick="showTab('sells')"><span>🛒</span>Sells</div>
<div id="n-tokbox" onclick="showTab('tokbox')"><span>📦</span>TokBox</div>
<div id="n-inbox" onclick="showTab('inbox')"><span>📥</span>Inbox</div>
<div id="n-earn" onclick="showTab('earn')"><span>💰</span>Earn</div>
<div id="n-bank" onclick="showTab('bank')"><span>🏦</span>Bank</div>
</div>

<script type="module">
let users = JSON.parse(localStorage.getItem('yokelbty_users')||'[{"user":"yokel","pass":"123","bank":"3127021932525"}]');
let currentUser = localStorage.getItem('yokelbty_current')||'';
let bankData = JSON.parse(localStorage.getItem('yokel_bank_only')||'{"name":"BSP","accName":"Brenton","accNum":"3127021932525"}');
let earn = JSON.parse(localStorage.getItem('yokel_earn_v33')||'{"feed":0,"reel":0,"like":0}');
function saveUsers(){localStorage.setItem('yokelbty_users',JSON.stringify(users));}
function saveEarn(){localStorage.setItem('yokel_earn_v33',JSON.stringify(earn));}
window.toggleEye=function(id,el){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';el.textContent=i.type==='password'?'👁️':'🙈';}
window.showLogin=function(){document.getElementById('loginForm').classList.remove('hidden');document.getElementById('createForm').classList.add('hidden');document.getElementById('forgotForm').classList.add('hidden');}
window.showCreate=function(){document.getElementById('loginForm').classList.add('hidden');document.getElementById('createForm').classList.remove('hidden');document.getElementById('forgotForm').classList.add('hidden');}
window.showForgot=function(){document.getElementById('loginForm').classList.add('hidden');document.getElementById('createForm').classList.add('hidden');document.getElementById('forgotForm').classList.remove('hidden');}
window.doLogin=function(){const u=document.getElementById('loginUser').value.trim();const p=document.getElementById('loginPass').value.trim();const f=users.find(x=>x.user.toLowerCase()===u.toLowerCase()&&x.pass===p);if(!f){alert('Wrong! yokel/123');return;}currentUser=f.user;localStorage.setItem('yokelbty_current',currentUser);document.getElementById('loginScreen').style.display='none';document.getElementById('currentUserDisplay').innerText=currentUser;}
window.doCreate=function(){const u=document.getElementById('createUser').value.trim();const p=document.getElementById('createPass').value.trim();const p2=document.getElementById('createPass2').value.trim();const b=document.getElementById('createBank').value.trim()||'3127021932525';if(p!==p2){alert('Not match');return;}users.push({user:u,pass:p,bank:b});saveUsers();currentUser=u;localStorage.setItem('yokelbty_current',u);document.getElementById('loginScreen').style.display='none';}
window.doForgot=function(){const u=document.getElementById('forgotUser').value.trim();const f=users.find(x=>x.user.toLowerCase()===u.toLowerCase());document.getElementById('forgotResult').innerText=f?'Password: '+f.pass:'Not found';}
window.logout=function(){localStorage.removeItem('yokelbty_current');location.reload();}
if(currentUser){document.getElementById('loginScreen').style.display='none';}else{document.getElementById('loginScreen').style.display='flex';}
window.showTab=function(t){document.querySelectorAll('.main').forEach(e=>e.classList.add('hidden'));document.querySelectorAll('.nav div').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t).classList.remove('hidden');document.getElementById('n-'+t).classList.add('active');}
window.postReal=async function(){const text=document.getElementById('postText').value;const file=document.getElementById('fileFeed').files[0];const fb=window.fb;let url='';if(file){const r=fb.ref(fb.storage,'YokelBTY/live/'+Date.now()+'_'+file.name);await fb.uploadBytes(r,file);url=await fb.getDownloadURL(r);}await fb.addDoc(fb.collection(fb.db,'live'),{text,url,type:file?(file.type.startsWith('video')?'video':'image'):'text',user:currentUser||'yokel',likes:0,time:new Date().toLocaleString(),createdAt:fb.serverTimestamp()});document.getElementById('postText').value='';earn.feed+=2;saveEarn();}
window.postReelReal=async function(input){const file=input.files[0];const fb=window.fb;const r=fb.ref(fb.storage,'YokelBTY/reels/'+Date.now()+'_'+file.name);await fb.uploadBytes(r,file);const url=await fb.getDownloadURL(r);await fb.addDoc(fb.collection(fb.db,'live'),{text:'First reels post testing',url,type:'reel',user:currentUser||'yokel',likes:0,time:new Date().toLocaleString(),createdAt:fb.serverTimestamp(),quote:"There will always be thousands of reasons to give up, but I realize that my dream is not only for me but for my family too."});}
window.likePost=async function(id){const fb=window.fb;await fb.updateDoc(fb.doc(fb.db,'live',id),{likes:fb.increment(1)});}
window.deletePost=async function(id){if(!confirm('Delete?'))return;const fb=window.fb;await fb.deleteDoc(fb.doc(fb.db,'live',id));}
window.sendTokBox=async function(){const txt=document.getElementById('tokMsg').value;if(!txt)return;const fb=window.fb;await fb.addDoc(fb.collection(fb.db,'messages'),{text:txt,user:currentUser||'yokel',time:new Date().toLocaleString(),createdAt:fb.serverTimestamp()});document.getElementById('tokMsg').value='';}
window.withdraw=function(){alert('Withdraw to BSP 3127021932525');}
window.payFee=function(){alert('Fee paid');}
window.saveBank=function(){alert('Saved');}
setTimeout(()=>{
const fb=window.fb;
const q=fb.query(fb.collection(fb.db,'live'),fb.orderBy('createdAt','desc'));
fb.onSnapshot(q,(snap)=>{
let html='';let rh='';let c=0;
snap.forEach(d=>{const p=d.data();const id=d.id;c++;
let m='';if(p.url){m=p.type==='video'||p.type==='reel'?`<video src="${p.url}" controls style="width:100%"></video>`:`<img src="${p.url}" style="width:100%">`;}
if(p.type==='reel'){rh+=`<div class="card"><b>${p.user}</b>${m}<div style="text-align:center;font-style:italic;margin-top:8px">"${p.quote||'There will always be thousands of reasons to give up, but I realize that my dream is not only for me but for my family too.'}"</div><div class="action-row"><button onclick="likePost('${id}')">❤️ ${p.likes||0}</button><button onclick="deletePost('${id}')">🗑️</button></div></div>`;}
else{html+=`<div class="card"><b>${p.user}</b> ${p.time||''}<div>${p.text||''}</div>${m}<div class="action-row"><button onclick="likePost('${id}')">❤️ ${p.likes||0}</button><button onclick="deletePost('${id}')">🗑️</button></div></div>`;}
});
document.getElementById('feedList').innerHTML=html||'No posts';
document.getElementById('reelsList').innerHTML=rh||'No reels';
document.getElementById('cloudCount').innerText=c;
document.getElementById('liveStatus').innerText=c+' posts LIVE';
});
const q2=fb.query(fb.collection(fb.db,'messages'),fb.orderBy('createdAt','desc'));
fb.onSnapshot(q2,(snap)=>{let h='';snap.forEach(d=>{const m=d.data();h+=`<div class="card"><b>${m.user}</b>: ${m.text}</div>`;});document.getElementById('tokboxList').innerHTML=h;document.getElementById('inboxList').innerHTML=h;});
},800);
</script>
</body>
</html>
