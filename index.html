<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YokelBTY V32 - LOGIN + WORLD CLOUD</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyA7JJpeSfV-pY-XCtsdXLvITFQmAvZ8pKo",
  authDomain: "yokelbook-global.firebaseapp.com",
  databaseURL: "https://yokelbook-global-default-rtdb.firebaseio.com",
  projectId: "yokelbook-global",
  storageBucket: "yokelbook-global.firebasestorage.app",
  messagingSenderId: "1048288092483",
  appId: "1:1048288092483:web:0f6eb6073dfc94b0d3cff6",
  measurementId: "G-PWSQK0RMRK"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
window.fb = { db, storage, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, ref, uploadBytes, getDownloadURL };
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#000;color:#fff}
.top{position:fixed;top:0;width:100%;z-index:100;background:linear-gradient(90deg,#000,#ff3c00);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:18px}
.main{margin-top:52px;margin-bottom:65px}
.nav{position:fixed;bottom:0;width:100%;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:6px 0;z-index:100}
.nav div{font-size:9px;text-align:center;color:#666;flex:1;cursor:pointer}
.nav div.active{color:#ffcc00}
.nav span{font-size:18px;display:block}
.card{background:#111;margin:8px;border-radius:14px;border:1px solid #222;padding:12px}
.btn{border:none;padding:12px;border-radius:12px;font-weight:900;width:100%;margin-top:8px;cursor:pointer}
.btn-world{background:linear-gradient(90deg,#000,#ff1a1a);color:#fff}
.btn-pin{background:#ffcc00;color:#000}
.btn-green{background:#00ff88;color:#000}
.hidden{display:none}
select,input,textarea{background:#0a0a0a;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;width:100%;margin-top:8px}
.live-dot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#loginScreen{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:360px;background:#111;border:1px solid #222;border-radius:20px;padding:20px}
.login-logo{text-align:center;font-size:28px;font-weight:900;background:linear-gradient(90deg,#ff0050,#00f2ea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.input-wrap{position:relative}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px;user-select:none}
.link{font-size:12px;color:#ffcc00;cursor:pointer;text-align:center;margin-top:10px;display:block}
.small{font-size:11px;color:#888;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div id="loginScreen">
<div class="login-box">
<div class="login-logo">YokelBTY</div>
<div style="text-align:center;font-size:11px;color:#00ff88;margin-bottom:16px"><span class="live-dot"></span> V32 • LOGIN RESTORED</div>
<div id="loginForm">
<input id="loginUser" placeholder="Username">
<div class="input-wrap"><input id="loginPass" type="password" placeholder="Password"><span class="eye" onclick="toggleEye('loginPass',this)">👁️</span></div>
<button class="btn btn-world" onclick="doLogin()">Login to YokelBTY</button>
<span class="link" onclick="showForgot()">Forgot password?</span>
<span class="link" onclick="showCreate()">Create account</span>
</div>
<div id="createForm" class="hidden">
<input id="createUser" placeholder="Choose username">
<div class="input-wrap"><input id="createPass" type="password" placeholder="Choose password"><span class="eye" onclick="toggleEye('createPass',this)">👁️</span></div>
<div class="input-wrap"><input id="createPass2" type="password" placeholder="Confirm password"><span class="eye" onclick="toggleEye('createPass2',this)">👁️</span></div>
<input id="createBank" placeholder="BSP e.g. 3127021932525">
<button class="btn btn-pin" onclick="doCreate()">Create Account ✅</button>
<span class="link" onclick="showLogin()">Already have account? Login</span>
</div>
<div id="forgotForm" class="hidden">
<input id="forgotUser" placeholder="Enter username">
<button class="btn btn-pin" onclick="doForgot()">Recover Password 🔑</button>
<span class="link" onclick="showLogin()">Back to Login</span>
<div id="forgotResult" style="margin-top:10px;color:#00ff88"></div>
</div>
</div>
</div>

<div class="top"><div class="logo">YOKEL BTY 🇵🇬 <span style="background:#ffcc00;color:#000;padding:2px 8px;border-radius:10px;font-size:11px">V32</span> <span style="background:#00ff88;color:#000;padding:2px 8px;border-radius:10px;font-size:10px">LIVE</span></div><div><button onclick="logout()" style="background:#222;color:#fff;border:1px solid #333;padding:6px 12px;border-radius:8px">Out</button></div></div>

<div class="main" id="tab-feed">
<div class="card" style="border-color:#00ff88">
<div style="display:flex;gap:8px;align-items:center"><div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(45deg,#ff0050,#00f2ea);display:flex;align-items:center;justify-content:center;font-weight:900">Y</div><div><b id="currentUserDisplay">Yokel</b><div style="font-size:10px;color:#00ff88">WORLD CLOUD</div></div></div>
<textarea id="postText" placeholder="Wanem niupela? WORLD CLOUD!"></textarea>
<input type="file" id="fileFeed" accept="image/*,video/*">
<div style="display:flex;gap:8px"><button class="btn btn-world" style="flex:1" onclick="postReal()">Postim to WORLD ☁️🚀</button><button class="btn" style="flex:0 0 70px;background:#222;color:#fff" onclick="document.getElementById('postText').value=''">Clear</button></div>
<div style="font-size:11px;color:#0f0;margin-top:6px">✅ CLOUD LIVE - <span id="cloudCount">0</span> posts!</div>
</div>
<div id="feedList"><div class="card" style="text-align:center">Loading WORLD...</div></div>
</div>

<div class="main hidden" id="tab-reels"><div style="padding:8px"><button class="btn btn-world" style="width:auto" onclick="document.getElementById('fileReel').click()">Post Reel ☁️</button><input type="file" id="fileReel" accept="video/*" hidden onchange="postReelReal(this)"></div><div id="reelsList"></div></div>
<div class="main hidden" id="tab-sells"><div class="card">🏪 Sells</div><div id="sellsList"></div></div>
<div class="main hidden" id="tab-earn"><div class="card"><h3>💰 Earn</h3><h1>K <span id="myEarn">0.00</span></h1><button class="btn btn-green" onclick="withdraw()">Withdraw</button><button class="btn btn-pin" onclick="payFee()">Pay 10% to BSP 3127021932525</button></div></div>
<div class="main hidden" id="tab-bank"><div class="card"><h3>🏦 Bank</h3><select id="bankSelect"><option>BSP - Bank South Pacific</option><option>Kina Bank</option><option>ANZ PNG</option><option>Westpac PNG</option></select><input id="accName" placeholder="Name"><input id="accNum" placeholder="Number"><button class="btn btn-pin" onclick="saveBank()">Save</button><div id="savedBank"></div></div></div>
<div class="main hidden" id="tab-tokbox"><div class="card">📦 TokBox</div></div>
<div class="main hidden" id="tab-inbox"><div class="card">📥 Inbox</div></div>

<div class="nav">
<div class="active" id="n-feed" onclick="showTab('feed')"><span>🏠</span>Feed</div>
<div id="n-reels" onclick="showTab('reels')"><span>🎬</span>Reels</div>
<div id="n-sells" onclick="showTab('sells')"><span>🛒</span>Sells</div>
<div id="n-tokbox" onclick="showTab('tokbox')"><span>📦</span>TokBox</div>
<div id="n-inbox" onclick="showTab('inbox')"><span>📥</span>Inbox</div>
<div id="n-earn" onclick="showTab('earn')"><span>💰</span>Earn</div>
<div id="n-bank" onclick="showTab('bank')"><span>🏦</span>Bank</div>
</div>

<script type="module">
let users = JSON.parse(localStorage.getItem('yokelbty_users')||'[{"user":"yokel","pass":"123","bank":"3127021932525"}]');
let currentUser = localStorage.getItem('yokelbty_current')||'';
let bankData = JSON.parse(localStorage.getItem('yokel_bank_only')||'{"name":"BSP","accName":"Brenton","accNum":"3127021932525"}');
let earn = JSON.parse(localStorage.getItem('yokel_earn_v31')||'{"feed":0,"reel":0,"like":0}');
function saveUsers(){localStorage.setItem('yokelbty_users',JSON.stringify(users));}
window.toggleEye=function(id,el){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';el.textContent=i.type==='password'?'👁️':'🙈';}
window.showLogin=function(){document.getElementById('loginForm').classList.remove('hidden');document.getElementById('createForm').classList.add('hidden');document.getElementById('forgotForm').classList.add('hidden');}
window.showCreate=function(){document.getElementById('loginForm').classList.add('hidden');document.getElementById('createForm').classList.remove('hidden');document.getElementById('forgotForm').classList.add('hidden');}
window.showForgot=function(){document.getElementById('loginForm').classList.add('hidden');document.getElementById('createForm').classList.add('hidden');document.getElementById('forgotForm').classList.remove('hidden');}
window.doLogin=function(){const u=document.getElementById('loginUser').value.trim();const p=document.getElementById('loginPass').value.trim();const f=users.find(x=>x.user.toLowerCase()===u.toLowerCase()&&x.pass===p);if(!f){alert('Wrong! Try yokel/123');return;}currentUser=f.user;localStorage.setItem('yokelbty_current',currentUser);document.getElementById('loginScreen').style.display='none';document.getElementById('currentUserDisplay').innerText=currentUser;}
window.doCreate=function(){const u=document.getElementById('createUser').value.trim();const p=document.getElementById('createPass').value.trim();const p2=document.getElementById('createPass2').value.trim();const b=document.getElementById('createBank').value.trim()||'3127021932525';if(p!==p2){alert('Passwords not match');return;}users.push({user:u,pass:p,bank:b});saveUsers();currentUser=u;localStorage.setItem('yokelbty_current',u);document.getElementById('loginScreen').style.display='none';}
window.doForgot=function(){const u=document.getElementById('forgotUser').value.trim();const f=users.find(x=>x.user.toLowerCase()===u.toLowerCase());document.getElementById('forgotResult').innerText=f?'Password: '+f.pass:'Not found';}
window.logout=function(){localStorage.removeItem('yokelbty_current');location.reload();}
if(currentUser){document.getElementById('loginScreen').style.display='none';}else{document.getElementById('loginScreen').style.display='flex';}
window.showTab=function(t){document.querySelectorAll('.main').forEach(e=>e.classList.add('hidden'));document.querySelectorAll('.nav div').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t).classList.remove('hidden');document.getElementById('n-'+t).classList.add('active');}
window.postReal=async function(){const text=document.getElementById('postText').value;const file=document.getElementById('fileFeed').files[0];const fb=window.fb;let url='';if(file){const r=fb.ref(fb.storage,'YokelBTY/posts/'+Date.now()+'_'+file.name);await fb.uploadBytes(r,file);url=await fb.getDownloadURL(r);}await fb.addDoc(fb.collection(fb.db,'YokelBTY_WorldPosts'),{text,url,type:file?(file.type.startsWith('video')?'video':'image'):'text',user:currentUser||'yokel',time:new Date().toLocaleString(),createdAt:fb.serverTimestamp()});document.getElementById('postText').value='';}
window.postReelReal=async function(input){const file=input.files[0];const fb=window.fb;const r=fb.ref(fb.storage,'YokelBTY/reels/'+Date.now()+'_'+file.name);await fb.uploadBytes(r,file);const url=await fb.getDownloadURL(r);await fb.addDoc(fb.collection(fb.db,'YokelBTY_WorldPosts'),{text:'First reels post',url,type:'reel',user:currentUser||'yokel',time:new Date().toLocaleString(),createdAt:fb.serverTimestamp()});}
window.saveBank=function(){alert('Saved');}
window.withdraw=function(){alert('Withdraw to BSP 3127021932525');}
window.payFee=function(){alert('Fee paid');}
setTimeout(()=>{
const fb=window.fb;
const q=fb.query(fb.collection(fb.db,'YokelBTY_WorldPosts'),fb.orderBy('createdAt','desc'));
fb.onSnapshot(q,(snap)=>{
let html='';let rh='';let c=0;
snap.forEach(d=>{const p=d.data();c++;let m='';if(p.url){m=p.type==='video'||p.type==='reel'?`<video src="${p.url}" controls style="width:100%"></video>`:`<img src="${p.url}" style="width:100%">`;}
if(p.type==='reel'){rh+=`<div class="card"><b>${p.user}</b>${m}<div style="text-align:center;font-style:italic;margin-top:8px">"There will always be thousands of reasons to give up, but I realize that my dream is not only for me but for my family too."</div></div>`;}else{html+=`<div class="card"><b>${p.user}</b> ${p.time||''}<div>${p.text||''}</div>${m}</div>`;}
});
document.getElementById('feedList').innerHTML=html||'No posts';
document.getElementById('reelsList').innerHTML=rh||'No reels';
document.getElementById('cloudCount').innerText=c;
});
},800);
</script>
</body>
</html>
