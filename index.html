<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YokelBTY V33.2 FINAL - FULL</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyA7JJpeSfV-pY-XCtsdXLvITFQmAvZ8pKo",authDomain:"yokelbook-global.firebaseapp.com",projectId:"yokelbook-global",storageBucket:"yokelbook-global.firebasestorage.app",messagingSenderId:"1048288092483",appId:"1:1048288092483:web:0f6eb6073dfc94b0d3cff6"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const storage=getStorage(app);
window.fb={db,storage,collection,addDoc,onSnapshot,query,orderBy,serverTimestamp,doc,updateDoc,increment,deleteDoc,ref,uploadBytes,getDownloadURL};
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#000;color:#fff}
.top{position:fixed;top:0;width:100%;z-index:100;background:linear-gradient(90deg,#000,#ff3c00);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.main{margin-top:56px;margin-bottom:72px}
.nav{position:fixed;bottom:0;width:100%;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:6px 0;z-index:100}
.nav div{font-size:9px;text-align:center;color:#666;flex:1}
.nav div.active{color:#ffcc00}
.nav span{font-size:18px;display:block}
.card{background:#111;margin:8px;border-radius:16px;border:1px solid #222;padding:12px}
.btn{border:none;padding:13px;border-radius:12px;font-weight:900;width:100%;margin-top:8px;cursor:pointer}
.btn-world{background:linear-gradient(90deg,#000,#ff1a1a);color:#fff}
.btn-pin{background:#ffcc00;color:#000}
.hidden{display:none}
input,textarea,select{background:#0a0a0a;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;width:100%;margin-top:8px}
#loginScreen{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:380px;background:#111;border:1px solid #222;border-radius:20px;padding:22px}
.input-wrap{position:relative}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer}
.link{font-size:12px;color:#ffcc00;cursor:pointer;text-align:center;margin-top:12px;display:block}
</style>
</head>
<body>
<div id="loginScreen"><div class="login-box">
<div style="text-align:center;font-weight:900;font-size:28px;background:linear-gradient(90deg,#ff0050,#00f2ea);-webkit-background-clip:text;-webkit-text-fill-color:transparent">YokelBTY</div>
<div style="text-align:center;font-size:10px;color:#0f0;margin-bottom:12px">V33.2 FINAL • WORLD CLOUD</div>
<div id="loginForm"><input id="loginUser" placeholder="yokel"><div class="input-wrap"><input id="loginPass" type="password" placeholder="123"><span class="eye" onclick="toggleEye('loginPass',this)">👁️</span></div><button class="btn btn-world" onclick="doLogin()">Login 🔥</button><span class="link" onclick="showForgot()">Forgot?</span><span class="link" onclick="showCreate()">Create account</span></div>
<div id="createForm" class="hidden"><input id="createUser" placeholder="New user"><input id="createPass" type="password" placeholder="Pass"><input id="createPass2" type="password" placeholder="Confirm"><button class="btn btn-pin" onclick="doCreate()">Create ✅</button><span class="link" onclick="showLogin()">Back</span></div>
<div id="forgotForm" class="hidden"><input id="forgotUser" placeholder="Username"><button class="btn btn-pin" onclick="doForgot()">Recover</button><span class="link" onclick="showLogin()">Back</span><div id="forgotResult" style="margin-top:10px;color:#0f0"></div></div>
</div></div>

<div class="top"><div class="logo">YOKEL BTY 🇵🇬 V33.2 FULL</div><button onclick="logout()" style="background:#222;color:#fff;border:1px solid #333;padding:6px 10px;border-radius:8px">Out</button></div>

<div class="main" id="tab-feed">
<div class="card" style="border-color:#00ff88">
<b id="currentUserDisplay">Yokel</b> - <span id="liveStatus">Connecting...</span> • <span id="cloudCount">0</span> ☁️
<textarea id="postText" placeholder="Type text only OR add photo..."></textarea>
<input type="file" id="fileFeed" accept="image/*,video/*">
<button class="btn btn-world" onclick="postReal()">Postim to WORLD ☁️ (Text OR Photo)</button>
<div id="postLog" style="font-size:11px;color:#888;background:#000;padding:8px;margin-top:8px;border-radius:8px">Ready...</div>
</div>
<div id="feedList"></div>
</div>

<div class="main hidden" id="tab-reels"><div id="reelsList"></div></div>
<div class="main hidden" id="tab-sells"><div id="sellsList"></div></div>
<div class="main hidden" id="tab-tokbox"><div class="card"><input id="tokMsg" placeholder="Message..."><button class="btn btn-pin" onclick="sendTokBox()">Send</button></div><div id="tokboxList"></div></div>
<div class="main hidden" id="tab-inbox"><div id="inboxList"></div></div>
<div class="main hidden" id="tab-earn"><div class="card">Earn <span id="myEarn">0</span></div></div>
<div class="main hidden" id="tab-bank"><div class="card">Bank</div></div>

<div class="nav"><div class="active" id="n-feed" onclick="showTab('feed')"><span>🏠</span>Feed</div><div id="n-reels" onclick="showTab('reels')"><span>🎬</span>Reels</div><div id="n-sells" onclick="showTab('sells')"><span>🛒</span>Sells</div><div id="n-tokbox" onclick="showTab('tokbox')"><span>📦</span>TokBox</div><div id="n-inbox" onclick="showTab('inbox')"><span>📥</span>Inbox</div><div id="n-earn" onclick="showTab('earn')"><span>💰</span>Earn</div><div id="n-bank" onclick="showTab('bank')"><span>🏦</span>Bank</div></div>

<script type="module">
let users=JSON.parse(localStorage.getItem('yokelbty_users')||'[{"user":"yokel","pass":"123"}]');
let currentUser=localStorage.getItem('yokelbty_current')||'';
window.toggleEye=function(id,el){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';el.textContent=i.type==='password'?'👁️':'🙈';}
window.showLogin=function(){document.getElementById('loginForm').classList.remove('hidden');document.getElementById('createForm').classList.add('hidden');document.getElementById('forgotForm').classList.add('hidden');}
window.showCreate=function(){document.getElementById('loginForm').classList.add('hidden');document.getElementById('createForm').classList.remove('hidden');}
window.showForgot=function(){document.getElementById('loginForm').classList.add('hidden');document.getElementById('forgotForm').classList.remove('hidden');}
window.doLogin=function(){const u=document.getElementById('loginUser').value;const p=document.getElementById('loginPass').value;const f=users.find(x=>x.user===u&&x.pass===p);if(!f){alert('yokel/123');return;}currentUser=f.user;localStorage.setItem('yokelbty_current',currentUser);document.getElementById('loginScreen').style.display='none';}
window.doCreate=function(){const u=document.getElementById('createUser').value;const p=document.getElementById('createPass').value;users.push({user:u,pass:p});localStorage.setItem('yokelbty_users',JSON.stringify(users));currentUser=u;localStorage.setItem('yokelbty_current',u);document.getElementById('loginScreen').style.display='none';}
window.doForgot=function(){const u=document.getElementById('forgotUser').value;const f=users.find(x=>x.user===u);document.getElementById('forgotResult').innerText=f?'Pass: '+f.pass:'Not found';}
window.logout=function(){localStorage.removeItem('yokelbty_current');location.reload();}
if(currentUser)document.getElementById('loginScreen').style.display='none';else document.getElementById('loginScreen').style.display='flex';
window.showTab=function(t){document.querySelectorAll('.main').forEach(e=>e.classList.add('hidden'));document.querySelectorAll('.nav div').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t).classList.remove('hidden');document.getElementById('n-'+t).classList.add('active');}
window.postReal=async function(){
  const text=document.getElementById('postText').value.trim();
  const file=document.getElementById('fileFeed').files[0];
  const log=document.getElementById('postLog');
  if(!text&&!file){alert('Write text OR choose photo');return;}
  const fb=window.fb;
  let url='';
  try{
    if(file){
      log.innerText='Uploading photo...';
      const r=fb.ref(fb.storage,'YokelBTY/live/'+Date.now()+'_'+file.name);
      await fb.uploadBytes(r,file);
      url=await fb.getDownloadURL(r);
    }
    await fb.addDoc(fb.collection(fb.db,'live'),{text:text||'Photo',url,type:file?(file.type.startsWith('video')?'video':'image'):'text',user:currentUser||'yokel',likes:0,time:new Date().toLocaleString(),createdAt:fb.serverTimestamp()});
    log.innerText='✅ Posted to WORLD!';
    document.getElementById('postText').value='';document.getElementById('fileFeed').value='';
  }catch(e){log.innerText='❌ '+e.message;alert('Failed: '+e.message);}
};
setTimeout(()=>{
  const fb=window.fb;
  const q=fb.query(fb.collection(fb.db,'live'),fb.orderBy('createdAt','desc'));
  fb.onSnapshot(q,(snap)=>{
    let html='';let c=0;
    snap.forEach(d=>{const p=d.data();const id=d.id;c++;
      let m='';if(p.url){m=p.type==='video'?`<video src="${p.url}" controls style="width:100%"></video>`:`<img src="${p.url}" style="width:100%">`;}
      html+=`<div class="card"><b>${p.user}</b> ${p.time}<div>${p.text}</div>${m}<button onclick="window.fb.deleteDoc(window.fb.doc(window.fb.db,'live','${id}'))">Delete</button></div>`;
    });
    document.getElementById('feedList').innerHTML=html||'No posts';
    document.getElementById('cloudCount').innerText=c;
    document.getElementById('liveStatus').innerText=c+' posts LIVE';
  });
},800);
</script>
</body>
</html>
