<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YokelBTY 🇵🇬</title>
<style>
body{background:#111;color:#fff;font-family:Arial;margin:0;padding-bottom:70px}
body.light{background:#fff;color:#000}
header{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#000}
body.light header{background:#eee}
header h1{margin:0;font-size:24px} header h1 span{color:gold}
button{border:none;padding:8px 12px;border-radius:20px;background:#222;color:#fff;cursor:pointer}
body.light button{background:#ddd;color:#000}
.stories{display:flex;gap:12px;padding:12px;overflow-x:auto}
.story{width:70px;text-align:center;cursor:pointer;flex-shrink:0}
.story img,.story .add{width:65px;height:65px;border-radius:50%;border:3px solid gold;object-fit:cover;display:flex;align-items:center;justify-content:center;background:#333;font-size:28px}
.story p{font-size:12px;margin:4px 0}
.post{background:#1c1c1c;margin:10px;padding:12px;border-radius:12px}
body.light .post{background:#f2f2f2}
.post img{width:100%;border-radius:10px}
.reactions{display:flex;gap:10px;margin-top:8px}
.reactions span{background:#333;padding:6px 10px;border-radius:20px;cursor:pointer}
body.light .reactions span{background:#ddd}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#000;padding:10px}
body.light nav{background:#eee}
nav div{text-align:center;font-size:12px;cursor:pointer}
/* Modal */
#storyModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:99;align-items:center;justify-content:center;flex-direction:column;padding:20px}
#storyModal.show{display:flex}
#preview{width:90%;max-height:300px;object-fit:cover;border-radius:12px;display:none;margin:10px 0}
#storyModal input[type=text]{width:90%;padding:12px;border-radius:10px;border:none;margin:10px 0}
#storyView{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100;flex-direction:column;align-items:center;justify-content:center}
#storyView.show{display:flex}
#storyView img{width:100%;max-height:70vh;object-fit:cover}
#storyView h3{padding:10px}
</style>
</head>
<body>
<header>
<h1>Yokel<span>BTY</span> 🇵🇬</h1>
<div><button onclick="toggleMode()">🌙 / ☀️</button> <button>💬 Chat 2</button></div>
</header>

<div class="stories" id="stories"></div>

<div class="post">
<h3>YokelBTY 🇵🇬</h3>
<p>Come early, best price today 🐟🇵🇬</p>
<img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600">
<div class="reactions">
<span onclick="like(this)">❤️ <b>124</b></span>
<span onclick="like(this)">😂 <b>12</b></span>
<span onclick="like(this)">😮 <b>5</b></span>
<span onclick="like(this)">😡 <b>0</b></span>
<span onclick="like(this)">👍 <b>20</b></span>
</div>
</div>

<nav>
<div>🏠<br>Feed</div><div>👥<br>Friends</div><div>🛒<br>Market</div><div>💰<br>Money</div><div>💬<br>Chat</div><div>👤<br>Profile</div>
</nav>

<!-- ADD STORY MODAL -->
<div id="storyModal">
<h2>Add Your Story 📸</h2>
<label style="background:gold;color:#000;padding:12px 20px;border-radius:20px;cursor:pointer">📷 CHOOSE PHOTO
<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="previewPhoto(event)">
</label>
<img id="preview">
<input type="text" id="captionInput" placeholder="Write caption... e.g. YokelBTY is LIVE! From Village to GLOBAL! 🇵🇬">
<div style="display:flex;gap:10px">
<button onclick="closeModal()" style="background:#555">Cancel</button>
<button onclick="postStory()" style="background:gold;color:#000">Post Story ✅</button>
</div>
</div>

<!-- VIEW STORY -->
<div id="storyView" onclick="this.classList.remove('show')">
<img id="viewImg"><h3 id="viewCaption"></h3><p>Tap anywhere to close ✖️</p>
</div>

<script>
let stories = [
{name:"You", img:"", caption:"", isYou:true},
{name:"Mary 🐟", img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400", caption:"Fresh fish at Kokopo Market..."},
{name:"Paul 🌅", img:"https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=400", caption:"Sunset at Rabaul beach!"},
{name:"Ruth 🥥", img:"https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=400", caption:"Coconut day in village!"},
];
let tempPhoto = "";
function renderStories(){
let h = document.getElementById('stories');
h.innerHTML = "";
stories.forEach((s,i)=>{
h.innerHTML += `<div class="story" onclick="openStory(${i})">${s.img ? `<img src="${s.img}">` : `<div class="add">+</div>`}<p>${s.name}</p></div>`;
});
}
function openStory(i){
if(stories[i].isYou && !stories[i].img){
document.getElementById('storyModal').classList.add('show');
}else if(stories[i].img){
document.getElementById('viewImg').src = stories[i].img;
document.getElementById('viewCaption').innerText = stories[i].name + ": " + stories[i].caption;
document.getElementById('storyView').classList.add('show');
}else{
document.getElementById('storyModal').classList.add('show');
}
}
function previewPhoto(e){
let file = e.target.files[0];
let r = new FileReader();
r.onload = function(){ tempPhoto = r.result; let p=document.getElementById('preview'); p.src=tempPhoto; p.style.display='block'; }
r.readAsDataURL(file);
}
function postStory(){
let cap = document.getElementById('captionInput').value || "YokelBTY is LIVE! From Village to GLOBAL! 🇵🇬";
if(!tempPhoto){ alert("Please choose a photo first bro! 📸"); return; }
stories[0].img = tempPhoto; stories[0].caption = cap;
closeModal(); renderStories(); alert("Story posted! 🔥 Tap You to view!");
}
function closeModal(){ document.getElementById('storyModal').classList.remove('show'); }
function toggleMode(){ document.body.classList.toggle('light'); }
function like(el){ let b=el.querySelector('b'); b.innerText = parseInt(b.innerText)+1; }
renderStories();
</script>
</body>
</html>
