<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YokelBTY V33.1 DEBUG</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyA7JJpeSfV-pY-XCtsdXLvITFQmAvZ8pKo",authDomain:"yokelbook-global.firebaseapp.com",projectId:"yokelbook-global",storageBucket:"yokelbook-global.firebasestorage.app",messagingSenderId:"1048288092483",appId:"1:1048288092483:web:0f6eb6073dfc94b0d3cff6"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
window.db=db;window.addDoc=addDoc;window.collection=collection;window.serverTimestamp=serverTimestamp;
</script>
<style>body{background:#000;color:#fff;font-family:sans-serif;padding:20px}input,textarea{width:100%;padding:12px;margin:8px 0;background:#111;border:1px solid #333;color:#fff;border-radius:10px}button{width:100%;padding:14px;background:#ff3c00;color:#fff;border:none;border-radius:10px;font-weight:900;margin-top:8px}</style>
</head><body>
<h2>YokelBTY V33.1 DEBUG</h2>
<div style="font-size:12px;color:#0f0" id="status">Ready - Testing Firestore live collection</div>
<textarea id="postText" placeholder="Test post - e.g. Hello V33"></textarea>
<button onclick="testPost()">POSTIM TO WORLD - TEST</button>
<button onclick="testRead()" style="background:#222">TEST READ live collection</button>
<div id="log" style="background:#111;padding:12px;margin-top:12px;border-radius:10px;font-size:12px;white-space:pre-wrap;border:1px solid #333">Logs will appear here...</div>
<script type="module">
let user=localStorage.getItem('yokelbty_current')||'yokel';
function log(t){document.getElementById('log').innerText+='\n'+t; document.getElementById('status').innerText=t;}
window.testPost=async function(){
  const text=document.getElementById('postText').value||'Hello V33.1 Debug';
  log('Trying to post: '+text);
  try{
    const docRef=await window.addDoc(window.collection(window.db,'live'),{text:text,user:user,time:new Date().toLocaleString(),createdAt:window.serverTimestamp()});
    log('✅ SUCCESS! Posted ID: '+docRef.id+'\nCheck Firestore -> live collection -> you should see it!');
    alert('SUCCESS! Posted to WORLD CLOUD! ID: '+docRef.id);
  }catch(e){
    log('❌ FAILED: '+e.code+' - '+e.message+'\n\nFull error: '+JSON.stringify(e));
    alert('FAILED: '+e.message+'\n\nCode: '+e.code+'\n\nIf permission-denied -> Firestore Rules still false\nIf not-found -> Firestore Database not created\nIf unavailable -> check internet');
  }
}
window.testRead=async function(){
  log('Testing read...');
  try{
    const {getDocs}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const snap=await getDocs(window.collection(window.db,'live'));
    log('✅ READ SUCCESS: '+snap.size+' docs in live collection');
    alert('READ OK: '+snap.size+' posts found');
  }catch(e){log('❌ READ FAILED: '+e.message); alert('READ FAILED: '+e.message);}
}
</script>
</body></html>
