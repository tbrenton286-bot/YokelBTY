<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YokelBTY V33.7 FIX</title>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const cfg={apiKey:"AIzaSyA7JJpeSfV-pY-XCtsdXLvITFQmAvZ8pKo",authDomain:"yokelbook-global.firebaseapp.com",projectId:"yokelbook-global",storageBucket:"yokelbook-global.firebasestorage.app",messagingSenderId:"1048288092483",appId:"1:1048288092483:web:0f6eb6073dfc94b0d3cff6"};
const app=initializeApp(cfg);const db=getFirestore(app);const storage=getStorage(app);
window.fb={db,storage,collection,addDoc,onSnapshot,query,orderBy,serverTimestamp,ref,uploadBytes,getDownloadURL};
</script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff}.top{position:fixed;top:0;width:100%;background:linear-gradient(90deg,#000,#ff3c00);padding:12px;display:flex;justify-content:space-between;z-index:99}.main{margin-top:60px;margin-bottom:80px}.card{background:#111;margin:8px;border-radius:16px;border:1px solid #222;padding:12px}.btn{border:none;padding:13px;border-radius:12px;font-weight:900;width:100%;margin-top:8px}.btn-world{background:linear-gradient(90deg,#ff3c00,#ff0000);color:#fff}input,textarea{width:100%;padding:12px;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:10px;margin-top:8px}.nav{position:fixed;bottom:0;width:100%;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0}.nav div{color:#666;font-size:10px;text-align:center;flex:1}.nav div.active{color:#ffcc00}img,video{width:100%;border-radius:12px;margin-top:8px;max-height:500px;object-fit:contain;background:#000}
.login{position:fixed;inset:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}.loginBox{background:#111;border:1px solid #ff3c00;border-radius:20px;padding:20px;width:100%;max-width:360px}
.eyeBox{position:relative;display:flex;align-items:center}.eyeBtn{position:absolute;right:10px;background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
.link{color:#ffcc00;font-size:12px;margin-top:10px;display:inline-block;cursor:pointer}
</style></head><body>
<div class="login" id="loginScreen"><div class="loginBox">
<h2 style="text-align:center;color:#ff3c00">YOKEL BTY 🇵🇬</h2>
<p style="text-align:center;color:#888;font-size:12px;margin:6px 0 14px">Login to WORLD CLOUD</p>
<input id="u" placeholder="Username (yokel)" value="yokel" style="text-transform:lowercase">
<div class="eyeBox"><input id="p" type="password" placeholder="Password (123)" value="123"><button class="eyeBtn" onclick="toggleEye()" id="eyeBtn">👁️</button></div>
<div style="display:flex;justify-content:space-between;margin-top:10px"><span class="link" onclick="forgotPass()">Forgot password?</span><span class="link" onclick="showCreate()">Create account</span></div>
<button class="btn btn-world" onclick="doLogin()" style="margin-top:14px">Login 🔥</button>
<div id="loginMsg" style="font-size:11px;margin-top:8px;color:#888;text-align:center">Default: yokel / 123 • V33.7 FIX</div>
<div id="createArea" style="display:none;margin-top:16px;border-top:1px solid #222;padding-top:12px">
<b style="font-size:12px;color:#ffcc00">Create New Account</b>
<input id="cu" placeholder="New username"><div class="eyeBox"><input id="cp" type="password" placeholder="New password"><button class="eyeBtn" onclick="toggleEye2()">👁️</button></div>
<button class="btn" onclick="doCreate()" style="background:#00ff88;color:#000;margin-top:8px">Create Account ✅</button><button class="btn" onclick="hideCreate()" style="background:#222;color:#fff">Cancel</button>
</div></div></div>
<div class="top"><b>YOKEL BTY 🇵🇬</b><span style="background:#00ff88;color:#000;padding:4px 8px;border-radius:8px;font-size:10px" id="userBadge">WORLD LIVE</span></div>
<div class="main"><div class="card" style="border:1px solid #ff3c00">
<div style="font-size:12px;color:#ffcc00">☁️ WORLD CLOUD • <span id="count">0</span> • <span id="who"></span> • FIXED</div>
<textarea id="postText" placeholder="Wanem niupela? Postim tingting blo yu..."></textarea>
<input type="file" id="fileFeed" accept="image/*,video/*" onchange="previewFile()">
<div id="preview" style="display:none;margin-top:8px;border:1px dashed #ff3c00;border-radius:12px;padding:8px"><img id="previewImg" style="display:none"><video id="previewVid" controls style="display:none"></video><button onclick="clearFile()" style="background:#222;color:#fff;border:1px solid #333;padding:6px;border-radius:8px;margin-top:6px;font-size:11px">❌ Remove</button></div>
<button class="btn btn-world" onclick="postReal()">Postim to WORLD ☁️🚀</button>
<div id="log" style="font-size:11px;background:#000;padding:8px;border-radius:8px;margin-top:8px;border:1px solid #222">Ready... V33.7 decode fixed</div>
<button onclick="logout()" style="margin-top:8px;background:#222;color:#888;border:1px solid #333;padding:6px;border-radius:8px;font-size:11px;width:100%">Logout</button>
</div><div id="feedList"><div class="card" style="text-align:center;color:#666">Login first...</div></div></div>
<div class="nav"><div class="active">🏠<br>Feed</div><div>🎬<br>Reels</div><div>🛒<br>Sells</div><div>📦<br>Box</div><div>💰<br>Earn</div></div>
<script>
let currentUser=null;
window.toggleEye=function(){const i=document.getElementById('p');i.type=i.type==='password'?'text':'password';document.getElementById('eyeBtn').innerText=i.type==='password'?'👁️':'🙈';}
window.toggleEye2=function(){const i=document.getElementById('cp');i.type=i.type==='password'?'text':'password';}
window.forgotPass=function(){alert('Default: yokel / 123');}
window.showCreate=function(){document.getElementById('createArea').style.display='block';}
window.hideCreate=function(){document.getElementById('createArea').style.display='none';}
window.doCreate=function(){const u=document.getElementById('cu').value.trim().toLowerCase();const p=document.getElementById('cp').value.trim();if(!u||!p){alert('Raitim username na password');return;}let users=JSON.parse(localStorage.getItem('yokel_users')||'[]');if(users.find(x=>x.user===u)){alert('Username pinis');return;}users.push({user:u,pass:p});localStorage.setItem('yokel_users',JSON.stringify(users));alert('✅ Created: '+u);hideCreate();document.getElementById('u').value=u;document.getElementById('p').value=p;}
window.doLogin=function(){const u=document.getElementById('u').value.trim().toLowerCase();const p=document.getElementById('p').value.trim();let users=JSON.parse(localStorage.getItem('yokel_users')||'[]');users.push({user:'yokel',pass:'123'});const found=users.find(x=>x.user===u && x.pass===p);if(!found){document.getElementById('loginMsg').innerText='❌ Wrong! Try yokel / 123';document.getElementById('loginMsg').style.color='#f44';return;}currentUser=u;localStorage.setItem('yokel_current',u);document.getElementById('loginScreen').style.display='none';document.getElementById('who').innerText=u;document.getElementById('userBadge').innerText=u+' • LIVE';loadFeed();}
window.logout=function(){localStorage.removeItem('yokel_current');location.reload();}
const saved=localStorage.getItem('yokel_current');if(saved){document.getElementById('u').value=saved;document.getElementById('p').value='123';setTimeout(()=>{try{doLogin();}catch(e){}},300);}
window.previewFile=function(){const f=document.getElementById('fileFeed').files[0];if(!f)return;document.getElementById('preview').style.display='block';if(f.type.startsWith('video')){document.getElementById('previewImg').style.display='none';const v=document.getElementById('previewVid');v.style.display='block';v.src=URL.createObjectURL(f);}else{document.getElementById('previewVid').style.display='none';const i=document.getElementById('previewImg');i.style.display='block';i.src=URL.createObjectURL(f);}}
window.clearFile=function(){document.getElementById('fileFeed').value='';document.getElementById('preview').style.display='none';}
window.postReal=async function(){
 if(!currentUser){alert('Login first');return;}
 const text=document.getElementById('postText').value.trim();
 const file=document.getElementById('fileFeed').files[0];
 const log=document.getElementById('log');
 if(!text&&!file){alert('Raitim samting');return;}
 const fb=window.fb;let url='';
 try{
  if(file){
   log.innerText='⚡ Preparing...';let uploadFile=file;
   if(file.type.startsWith('image')){
    try{
     log.innerText='⚡ Compressing...';
     const blobUrl=URL.createObjectURL(file);
     const img=new Image();img.src=blobUrl;
     await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('decode fail'));});
     const canvas=document.createElement('canvas');
     const max=1024;let w=img.width,h=img.height;
     if(w>max||h>max){if(w>h){h=h*max/w;w=max;}else{w=w*max/h;h=max;}}
     canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
     const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.6));
     if(blob){uploadFile=new File([blob],file.name.replace(/\.\w+$/,'.jpg'),{type:'image/jpeg'});log.innerText=`⚡ ${(file.size/1024/1024).toFixed(1)}MB → ${(blob.size/1024).toFixed(0)}KB • Uploading...`;}
    }catch(e){console.log('Compress fail, original',e);log.innerText=`⚠️ Compress fail, uploading original ${(file.size/1024/1024).toFixed(1)}MB...`;uploadFile=file;}
   }else{log.innerText=`📤 Uploading video ${(file.size/1024/1024).toFixed(1)}MB...`;}
   const rf=fb.ref(fb.storage,'YokelBTY/live/'+Date.now()+'_'+uploadFile.name);
   await fb.uploadBytes(rf,uploadFile);url=await fb.getDownloadURL(rf);log.innerText='☁️ Saving...';
  }
  await fb.addDoc(fb.collection(fb.db,'live'),{text:text||'',url,type:file?(file.type.startsWith('video')?'video':'image'):'text',user:currentUser,time:new Date().toLocaleString(),createdAt:fb.serverTimestamp()});
  log.innerText='✅ Posted!';document.getElementById('postText').value='';clearFile();setTimeout(()=>log.innerText='Ready...',2000);
 }catch(e){log.innerText='❌ '+e.message;alert('FAILED: '+e.message);}
};
window.loadFeed=function(){const fb=window.fb;const q=fb.query(fb.collection(fb.db,'live'),fb.orderBy('createdAt','desc'));fb.onSnapshot(q,(snap)=>{let html='';let c=0;snap.forEach(d=>{const p=d.data();c++;let m='';if(p.url){m=p.type==='video'?`<video src="${p.url}" controls playsinline></video>`:`<img src="${p.url}">`;}html+=`<div class="card"><b>${p.user}</b> <small style="color:#888">${p.time||''}</small><div style="margin-top:8px;white-space:pre-wrap">${p.text||''}</div>${m}</div>`;});document.getElementById('feedList').innerHTML=html||'<div class="card">No posts</div>';document.getElementById('count').innerText=c;});};
</script>
</body></html>
